<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>統合消防通信指令システム（Yokohama Next-Gen Console）</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #090d16;
      color: #e2e8f0;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
    }
    .panel-box {
      background: linear-gradient(180deg, #111827 0%, #0d1320 100%);
      border: 1px solid #1e293b;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }
    .led-blink {
      animation: pulseLed 0.8s infinite alternate;
    }
    @keyframes pulseLed {
      from { opacity: 1; box-shadow: 0 0 12px rgba(239, 68, 68, 0.9); }
      to { opacity: 0.45; box-shadow: 0 0 2px rgba(239, 68, 68, 0.2); }
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen flex flex-col select-none">

  <!-- トップステータスバー -->
  <header class="bg-slate-950 border-b border-slate-800 px-4 py-2.5 flex flex-wrap items-center justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="w-3 h-3 rounded-full bg-emerald-400 shadow-[0_0_8px_#34d399]"></div>
      <div>
        <h1 class="text-base md:text-lg font-bold tracking-wider text-sky-300">
          統合消防通信指令システム <span class="text-xs font-normal text-slate-400 ml-1">YOKOHAMA COMMAND MODEL</span>
        </h1>
      </div>
      <span id="callStatusBadge" class="text-xs px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
        回線待機中
      </span>
    </div>

    <!-- 119番受令・終話・リセットコントロール -->
    <div class="flex flex-wrap items-center gap-2">
      <select id="scenarioSelect" class="bg-slate-900 border border-slate-700 text-xs text-slate-200 rounded px-2.5 py-1.5 focus:outline-none focus:border-sky-500">
        <option value="fire_high">訓練1：中区本町 3階建ビル火災（黒煙・逃げ遅れ）</option>
        <option value="ems_cpa">訓練2：西区みなとみらい 急病（意識なし・呼吸なし）</option>
        <option value="rescue_trap">訓練3：神奈川区 乗用車単独事故（車内閉じ込め）</option>
        <option value="ems_low">訓練4：南区 転倒による右足首痛（意識清明）</option>
        <option value="fire_alarm">訓練5：中区山下町 自動火災報知設備鳴動（煙なし）</option>
      </select>

      <button id="btnIncomingCall" onclick="triggerIncomingCall()" class="bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-3 py-1.5 rounded shadow transition cursor-pointer">
        119番 擬似入電
      </button>

      <button id="btnAnswerCall" onclick="answerCall()" disabled class="bg-slate-800 text-slate-500 text-xs font-bold px-3 py-1.5 rounded border border-slate-700 transition">
        受話応答
      </button>

      <button id="btnHangUp" onclick="hangUpCall()" disabled class="bg-slate-800 text-slate-500 text-xs font-bold px-3 py-1.5 rounded border border-slate-700 transition">
        終話
      </button>

      <button id="btnSystemReset" onclick="resetAfterHangUp()" disabled class="bg-slate-800 text-slate-500 text-xs font-bold px-3 py-1.5 rounded border border-slate-700 transition">
        リセット
      </button>

      <div class="bg-black/60 border border-slate-800 px-3 py-1 rounded font-mono text-sm text-emerald-400">
        通話: <span id="callTimer">00:00</span>
      </div>

      <div id="clockDisplay" class="font-mono text-sm text-slate-300 pl-1 hidden sm:block">
        00:00:00
      </div>
    </div>
  </header>

  <!-- メイン3ペインコンソール -->
  <main class="flex-1 grid grid-cols-1 lg:grid-cols-12 gap-3 p-3">

    <!-- 左ペイン：119番受令・聴取（4カラム） -->
    <section class="lg:col-span-4 panel-box rounded-lg p-3.5 flex flex-col gap-3">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h2 class="text-sm font-bold text-sky-400 flex items-center gap-1.5">
          <span class="bg-sky-500/20 text-sky-300 px-1.5 py-0.5 rounded text-xs">1</span> 119番受令・状況聴取
        </h2>
        <button type="button" onclick="clearFormInputsOnly()" class="text-xs text-slate-400 hover:text-white underline cursor-pointer">入力欄クリア</button>
      </div>

      <!-- 発信地情報 -->
      <div class="grid grid-cols-3 gap-2">
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">発信種別</label>
          <select id="callerType" onchange="updateDispatchPreview()" class="w-full bg-slate-900 border border-slate-700 rounded px-2 py-1.5 text-xs text-white">
            <option value="固定電話（住所特定）">固定電話（住所特定）</option>
            <option value="携帯電話（GPS測位）">携帯電話（GPS測位）</option>
            <option value="映像119連携">映像119連携</option>
          </select>
        </div>
        <div class="col-span-2">
          <label class="block text-[11px] text-slate-400 mb-1">災害発生場所（住所）</label>
          <input id="inputAddress" type="text" oninput="onManualInput()" placeholder="例：横浜市中区本町3丁目20番付近" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white focus:border-sky-500 focus:outline-none" />
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">目標物・建物名</label>
          <input id="inputLandmark" type="text" oninput="onManualInput()" placeholder="例：〇〇ビル北側" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white focus:border-sky-500 focus:outline-none" />
        </div>
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">災害詳細種別</label>
          <input id="inputSubType" type="text" oninput="onManualInput()" value="建物火災" class="w-full bg-slate-900 border border-slate-700 rounded px-2.5 py-1.5 text-xs text-white focus:border-sky-500 focus:outline-none" />
        </div>
      </div>

      <!-- 災害種別タブ -->
      <div>
        <label class="block text-[11px] text-slate-400 mb-1">指令種別カテゴリ</label>
        <div class="grid grid-cols-3 gap-1.5">
          <button type="button" id="tab-fire" onclick="setDisasterType('fire')" class="py-1.5 rounded text-xs font-bold bg-red-600 text-white border border-red-400 cursor-pointer">火災</button>
          <button type="button" id="tab-ems" onclick="setDisasterType('ems')" class="py-1.5 rounded text-xs font-bold bg-slate-900 text-slate-400 border border-slate-700 cursor-pointer">救急</button>
          <button type="button" id="tab-rescue" onclick="setDisasterType('rescue')" class="py-1.5 rounded text-xs font-bold bg-slate-900 text-slate-400 border border-slate-700 cursor-pointer">救助</button>
        </div>
      </div>

      <!-- 聴取チェックリスト -->
      <div class="bg-slate-950/80 border border-slate-800 rounded p-2.5">
        <div class="text-[11px] font-bold text-slate-300 mb-2">聴取確認項目（チェックまたはメモ入力で自動連動）</div>
        <div id="checklistContainer" class="grid grid-cols-2 gap-2 text-xs"></div>
      </div>

      <!-- 通報聴取メモ -->
      <div class="flex-1 flex flex-col">
        <div class="flex items-center justify-between mb-1">
          <label class="text-[11px] text-slate-400">通報内容メモ（危険ワード自動解析）</label>
          <button type="button" id="btnVoiceInput" onclick="startVoiceDictation()" class="text-[11px] bg-slate-800 hover:bg-slate-700 text-sky-300 px-2 py-0.5 rounded border border-slate-700 cursor-pointer">
            音声入力
          </button>
        </div>
        <textarea id="inputMemo" rows="4" oninput="onManualInput(); analyzeReception();" placeholder="通報者からの聴取内容を入力（例：3階から黒煙が見える、2階に1人逃げ遅れている模様）" class="w-full flex-1 bg-slate-900 border border-slate-700 rounded p-2.5 text-xs text-white leading-relaxed focus:border-sky-500 focus:outline-none"></textarea>
      </div>
    </section>

    <!-- 中央ペイン：AI緊急度判定・自動部隊編成（4カラム） -->
    <section class="lg:col-span-4 panel-box rounded-lg p-3.5 flex flex-col gap-3">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h2 class="text-sm font-bold text-amber-400 flex items-center gap-1.5">
          <span class="bg-amber-500/20 text-amber-300 px-1.5 py-0.5 rounded text-xs">2</span> 緊急度判定・自動部隊編成
        </h2>
        <span class="text-[11px] text-slate-400">AIトリアージ支援</span>
      </div>

      <!-- 緊急度インジケータ -->
      <div id="triageCard" class="rounded-lg p-3 border bg-amber-950/40 border-amber-600/60 transition-colors">
        <div class="flex items-center justify-between mb-1">
          <span class="text-xs text-slate-300 font-bold">判定緊急度・出動規模</span>
          <span id="triageBadge" class="text-xs font-bold px-2.5 py-0.5 rounded bg-amber-600 text-white">緊急度：中</span>
        </div>
        <div id="triageScaleText" class="text-base font-bold text-white mb-1.5">建物火災 第1出動相当</div>
        <div id="detectedKeywords" class="flex flex-wrap gap-1 min-h-[20px]"></div>
      </div>

      <!-- 口頭指導サジェスト -->
      <div class="bg-slate-950 border border-slate-800 rounded-lg p-2.5">
        <div class="text-[11px] font-bold text-emerald-400 mb-1">口頭指導・通報者への指示事項</div>
        <p id="oralGuidanceText" class="text-xs text-slate-200 leading-relaxed">
          安全な場所へ避難し、消防隊の到着を待つよう指示してください。
        </p>
      </div>

      <!-- 自動編成された出動予定隊 -->
      <div class="flex-1 flex flex-col bg-slate-950/80 border border-slate-800 rounded-lg p-2.5">
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold text-sky-300">編成済 出動予定隊（クリックで解除）</span>
          <button type="button" onclick="autoAssignUnits()" class="text-[11px] bg-sky-900/60 hover:bg-sky-800 text-sky-200 px-2 py-0.5 rounded border border-sky-700 cursor-pointer">
            自動再編成
          </button>
        </div>
        <div id="assignedUnitsList" class="flex flex-wrap gap-1.5 mb-3"></div>

        <div class="text-[11px] text-slate-400 border-t border-slate-800 pt-2 mb-1.5">出動可能車両から手動追加：</div>
        <div id="standbyPoolList" class="flex flex-wrap gap-1 overflow-y-auto max-h-36"></div>
      </div>
    </section>

    <!-- 右ペイン：指令発令・AVM車両動態（4カラム） -->
    <section class="lg:col-span-4 panel-box rounded-lg p-3.5 flex flex-col gap-3">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h2 class="text-sm font-bold text-rose-400 flex items-center gap-1.5">
          <span class="bg-rose-500/20 text-rose-300 px-1.5 py-0.5 rounded text-xs">3</span> 出動指令発令・AVM動態
        </h2>
        <span class="text-[11px] text-slate-400">終話後リセットで全隊復帰</span>
      </div>

      <!-- 指令電文プレビュー -->
      <div>
        <div class="flex items-center justify-between mb-1">
          <label class="text-[11px] text-slate-400">指令放送電文（自動生成・編集可）</label>
          <select id="chimeSelect" class="bg-slate-900 border border-slate-700 text-[11px] text-slate-200 rounded px-2 py-0.5">
            <option value="fire">チャイム：火災指令音</option>
            <option value="ems">チャイム：救急指令音</option>
            <option value="rescue">チャイム：救助指令音</option>
          </select>
        </div>
        <textarea id="dispatchText" rows="3" class="w-full bg-black/70 border border-slate-700 rounded p-2 text-xs text-amber-300 font-mono leading-relaxed focus:border-rose-500 focus:outline-none"></textarea>
      </div>

      <!-- 指令発令メインボタン -->
      <button id="btnDispatch" onclick="executeDispatch()" class="w-full py-3 rounded-lg bg-gradient-to-r from-rose-700 to-red-600 hover:from-rose-600 hover:to-red-500 text-white font-bold text-sm tracking-widest shadow-lg shadow-rose-950/60 border border-rose-400/50 transition cursor-pointer">
        指令発令（予告チャイム・音声放送）
      </button>

      <!-- AVM車両動態一覧ヘッダー -->
      <div class="flex items-center justify-between border-b border-slate-800 pb-1.5 text-xs">
        <span class="font-bold text-sky-400">AVM車両動態一覧</span>
        <span id="standbyCountLabel" class="text-[11px] text-emerald-400 font-mono">出動可能: 12 / 12隊</span>
      </div>

      <!-- AVM車両動態リスト -->
      <div id="avmPanel" class="flex-1 overflow-y-auto max-h-72 space-y-1.5 pr-1"></div>
    </section>

  </main>

  <script>
    // 初期車両マスタ（横浜消防モデル）
    const DEFAULT_VEHICLES = [
      { code: 'NAKA-P1', name: '中第1', station: '中消防署', type: 'pump', type_label: '水槽付ポンプ車', status: 'standby' },
      { code: 'NAKA-P2', name: '中第2', station: '中消防署', type: 'pump', type_label: '小型ポンプ車', status: 'standby' },
      { code: 'NAKA-L1', name: '中はしご1', station: '中消防署', type: 'ladder', type_label: '30m級はしご車', status: 'standby' },
      { code: 'NAKA-C1', name: '中指揮1', station: '中消防署', type: 'command', type_label: '指揮車', status: 'standby' },
      { code: 'NAKA-A1', name: '中救急1', station: '中消防署', type: 'ambulance', type_label: '高規格救急車', status: 'standby' },
      { code: 'NISHI-P1', name: '西第1', station: '西消防署', type: 'pump', type_label: '水槽付ポンプ車', status: 'standby' },
      { code: 'NISHI-A1', name: '西救急1', station: '西消防署', type: 'ambulance', type_label: '高規格救急車', status: 'standby' },
      { code: 'MINAMI-P1', name: '南第1', station: '南消防署', type: 'pump', type_label: '水槽付ポンプ車', status: 'standby' },
      { code: 'MINAMI-A1', name: '南救急1', station: '南消防署', type: 'ambulance', type_label: '高規格救急車', status: 'standby' },
      { code: 'SR-R1', name: '機動第1（SR）', station: '特別高度救助部隊', type: 'rescue', type_label: '救助工作車Ⅲ型', status: 'standby' },
      { code: 'SR-R2', name: '機動第2（SR）', station: '特別高度救助部隊', type: 'rescue', type_label: '機動けん引工作車', status: 'standby' },
      { code: 'KITA-P1', name: '神奈川第1', station: '神奈川消防署', type: 'pump', type_label: '水槽付ポンプ車', status: 'standby' }
    ];

    // 訓練シナリオ定義
    const SCENARIOS = {
      fire_high: {
        disasterType: 'fire',
        subType: '建物火災',
        callerType: '固定電話（住所特定）',
        address: '横浜市中区本町3丁目20番付近',
        landmark: '本町交差点北側ビル',
        memo: '3階建てビルの2階窓から黒煙と炎が噴き出している。2階に1人逃げ遅れがいる模様。'
      },
      ems_cpa: {
        disasterType: 'ems',
        subType: '急病',
        callerType: '携帯電話（GPS測位）',
        address: '横浜市西区みなとみらい2丁目3番付近',
        landmark: 'クイーンズスクエア1階通路',
        memo: '60代男性が突然倒れた。呼びかけに反応なく意識なし、呼吸もしていない。'
      },
      rescue_trap: {
        disasterType: 'rescue',
        subType: '交通事故救助',
        callerType: '携帯電話（GPS測位）',
        address: '横浜市神奈川区鶴屋町2丁目15番付近',
        landmark: '横浜駅きた西口高架下',
        memo: '乗用車とトラックの衝突事故。乗用車のドアが変形し運転手が車内に閉じ込められている。'
      },
      ems_low: {
        disasterType: 'ems',
        subType: '一般負傷',
        callerType: '固定電話（住所特定）',
        address: '横浜市南区吉野町4丁目12番付近',
        landmark: '吉野町駅前商店街',
        memo: '段差でつまずいて転倒し右足首を痛めた。意識清明で会話可能、出血なし。'
      },
      fire_alarm: {
        disasterType: 'fire',
        subType: '火災調査（自火報）',
        callerType: '固定電話（住所特定）',
        address: '横浜市中区山下町70番付近',
        landmark: '山下公園通りホテル',
        memo: '自動火災報知設備のベルが鳴動中。現在のところ煙や炎は確認できていない。'
      }
    };

    // 種別ごとの聴取チェック項目と自動判定キーワード
    const CHECKLIST_CONFIG = {
      fire: [
        { id: 'f_flame', label: '炎・火炎の視認', keywords: ['炎', '火の手', '燃えて'] },
        { id: 'f_smoke', label: '黒煙・白煙の噴出', keywords: ['黒煙', '煙', '白煙'] },
        { id: 'f_trapped', label: '逃げ遅れ・要救助者', keywords: ['逃げ遅れ', '閉じ込め', '中に人', '取り残'] },
        { id: 'f_building', label: '中高層・密集建物', keywords: ['ビル', 'マンション', '階', 'アパート'] },
        { id: 'f_danger', label: '危険物・爆発音', keywords: ['爆発', 'ガス', 'ガソリン', 'ボンベ'] },
        { id: 'f_alarm', label: '警報ベル鳴動のみ', keywords: ['報知', 'ベル', '誤報', '煙なし'] }
      ],
      ems: [
        { id: 'e_no_resp', label: '意識なし・反応なし', keywords: ['意識なし', '反応なし', '気絶', '呼びかけ'] },
        { id: 'e_no_breath', label: '呼吸なし・異常呼吸', keywords: ['呼吸なし', '息をしていない', '呼吸停止'] },
        { id: 'e_bleed', label: '大量出血・外傷', keywords: ['大量出血', '血が止まらない', '吐血'] },
        { id: 'e_chest', label: '激しい胸痛・麻痺', keywords: ['胸痛', '胸が痛い', 'ろれつ', '麻痺'] },
        { id: 'e_conscious', label: '意識清明・会話可能', keywords: ['意識清明', '会話可能', '話せる'] },
        { id: 'e_minor', label: '軽傷・歩行困難程度', keywords: ['足首', '打撲', 'すり傷', '軽傷'] }
      ],
      rescue: [
        { id: 'r_trap', label: '車内・機械への閉じ込め', keywords: ['閉じ込め', '挟まれ', '出られない'] },
        { id: 'r_traffic', label: '交通事故（衝突・転落）', keywords: ['事故', '衝突', '横転', '車両'] },
        { id: 'r_high', label: '高所・水難・エレベータ', keywords: ['エレベータ', '転落', '川', '海', '高所'] },
        { id: 'r_leak', label: '燃料漏れ・二次災害危険', keywords: ['燃料', 'オイル', '漏', '煙'] }
      ]
    };

    // アプリケーション状態管理
    let vehicles = JSON.parse(JSON.stringify(DEFAULT_VEHICLES));
    let currentDisasterType = 'fire';
    let selectedUnitCodes = [];
    let callState = 'idle'; // idle | ringing | connected | ended
    let audioCtx = null;
    let ringtoneInterval = null;
    let callTimerInterval = null;
    let callSeconds = 0;

    // 初期化処理
    window.addEventListener('DOMContentLoaded', () => {
      updateClock();
      setInterval(updateClock, 1000);
      renderChecklist();
      analyzeReception();
      renderAvmList();
      updateCallControlButtons();
    });

    // 現在時刻の更新
    function updateClock() {
      const now = new Date();
      document.getElementById('clockDisplay').textContent = now.toTimeString().split(' ')[0];
    }

    // Web Audio API コンテキスト取得
    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    // 通話コントロールボタン（受話応答・終話・リセット）の状態更新
    function updateCallControlButtons() {
      const badge = document.getElementById('callStatusBadge');
      const btnAnswer = document.getElementById('btnAnswerCall');
      const btnHangUp = document.getElementById('btnHangUp');
      const btnReset = document.getElementById('btnSystemReset');

      const disabledStyle = 'bg-slate-800 text-slate-500 text-xs font-bold px-3 py-1.5 rounded border border-slate-700 transition';

      btnAnswer.disabled = true;
      btnAnswer.className = disabledStyle;
      btnAnswer.textContent = '受話応答';

      btnHangUp.disabled = true;
      btnHangUp.className = disabledStyle;

      btnReset.disabled = true;
      btnReset.className = disabledStyle;

      if (callState === 'idle') {
        badge.textContent = '回線待機中';
        badge.className = 'text-xs px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700';
      } else if (callState === 'ringing') {
        badge.textContent = '119番 着信中';
        badge.className = 'text-xs px-2.5 py-0.5 rounded-full bg-rose-950 text-rose-300 border border-rose-600';
        btnAnswer.disabled = false;
        btnAnswer.className = 'bg-red-600 hover:bg-red-500 text-white text-xs font-bold px-3 py-1.5 rounded border border-red-300 led-blink cursor-pointer';
        btnAnswer.textContent = '119番 着信中！受話応答';
      } else if (callState === 'connected') {
        badge.textContent = '119番 通話接続中';
        badge.className = 'text-xs px-2.5 py-0.5 rounded-full bg-emerald-950 text-emerald-300 border border-emerald-600';
        btnHangUp.disabled = false;
        btnHangUp.className = 'bg-orange-600 hover:bg-orange-500 text-white text-xs font-bold px-3 py-1.5 rounded border border-orange-300 shadow cursor-pointer';
      } else if (callState === 'ended') {
        badge.textContent = '終話済（リセット待機）';
        badge.className = 'text-xs px-2.5 py-0.5 rounded-full bg-sky-950 text-sky-300 border border-sky-600';
        btnReset.disabled = false;
        btnReset.className = 'bg-sky-600 hover:bg-sky-500 text-white text-xs font-bold px-3 py-1.5 rounded border border-sky-300 shadow cursor-pointer';
      }
    }

    // 119番 擬似入電トリガー
    function triggerIncomingCall() {
      const ctx = getAudioContext();
      stopRingtone();
      stopCallTimer();
      callState = 'ringing';
      updateCallControlButtons();

      // 局線着信音（プルルル…）のループ再生
      const playRingBurst = () => {
        const now = ctx.currentTime;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(400, now);
        gain.gain.setValueAtTime(0.001, now);
        gain.gain.exponentialRampToValueAtTime(0.15, now + 0.05);
        gain.gain.setValueAtTime(0.15, now + 0.9);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(now);
        osc.stop(now + 1.05);
      };

      playRingBurst();
      ringtoneInterval = setInterval(playRingBurst, 2200);
    }

    // 着信音停止
    function stopRingtone() {
      if (ringtoneInterval) {
        clearInterval(ringtoneInterval);
        ringtoneInterval = null;
      }
    }

    // 通話タイマー停止（表示保持オプション付き）
    function stopCallTimer(resetDisplay = true) {
      if (callTimerInterval) {
        clearInterval(callTimerInterval);
        callTimerInterval = null;
      }
      if (resetDisplay) {
        callSeconds = 0;
        document.getElementById('callTimer').textContent = '00:00';
      }
    }

    // 受話応答（シナリオ読込＆タイマー開始）
    function answerCall() {
      stopRingtone();
      callState = 'connected';
      updateCallControlButtons();

      callSeconds = 0;
      document.getElementById('callTimer').textContent = '00:00';
      callTimerInterval = setInterval(() => {
        callSeconds++;
        const m = String(Math.floor(callSeconds / 60)).padStart(2, '0');
        const s = String(callSeconds % 60).padStart(2, '0');
        document.getElementById('callTimer').textContent = `${m}:${s}`;
      }, 1000);

      // 選択された訓練シナリオを受令フォームに展開
      const key = document.getElementById('scenarioSelect').value;
      const sc = SCENARIOS[key];
      if (sc) {
        setDisasterType(sc.disasterType);
        document.getElementById('callerType').value = sc.callerType;
        document.getElementById('inputAddress').value = sc.address;
        document.getElementById('inputLandmark').value = sc.landmark;
        document.getElementById('inputSubType').value = sc.subType;
        document.getElementById('inputMemo').value = sc.memo;
        analyzeReception();
      }
    }

    // 終話ボタンクリック処理（通話停止＆リセットボタン有効化）
    function hangUpCall() {
      stopRingtone();
      stopCallTimer(false);
      callState = 'ended';
      updateCallControlButtons();
    }

    // 終話後のリセット処理（全隊を出動可能へ復帰＆フォーム初期化）
    function resetAfterHangUp() {
      if (callState !== 'ended') return;
      stopRingtone();
      stopCallTimer(true);
      callState = 'idle';
      updateCallControlButtons();

      // 全車両を「出動可能」に戻す
      vehicles = vehicles.map(v => ({ ...v, status: 'standby' }));
      clearFormInputsOnly();
      renderAvmList();
    }

    // 手動入力や指令発令時に「終話」ボタンを操作可能にする補助
    function onManualInput() {
      updateDispatchPreview();
      if (callState === 'idle') {
        callState = 'connected';
        updateCallControlButtons();
      }
    }

    // 受令フォーム入力欄のみクリア
    function clearFormInputsOnly() {
      document.getElementById('inputAddress').value = '';
      document.getElementById('inputLandmark').value = '';
      document.getElementById('inputMemo').value = '';
      renderChecklist();
      analyzeReception();
    }

    // 災害種別タブ切替
    function setDisasterType(type) {
      currentDisasterType = type;
      ['fire', 'ems', 'rescue'].forEach(t => {
        const btn = document.getElementById('tab-' + t);
        if (t === type) {
          const colors = {
            fire: 'bg-red-600 text-white border-red-400',
            ems: 'bg-emerald-600 text-white border-emerald-400',
            rescue: 'bg-amber-600 text-white border-amber-400'
          };
          btn.className = `py-1.5 rounded text-xs font-bold border cursor-pointer ${colors[t]}`;
        } else {
          btn.className = 'py-1.5 rounded text-xs font-bold bg-slate-900 text-slate-400 border border-slate-700 cursor-pointer';
        }
      });

      document.getElementById('chimeSelect').value = type;
      if (type === 'fire') document.getElementById('inputSubType').value = '建物火災';
      if (type === 'ems') document.getElementById('inputSubType').value = '急病';
      if (type === 'rescue') document.getElementById('inputSubType').value = '救助事案';

      renderChecklist();
      analyzeReception();
    }

    // 聴取チェックリスト描画
    function renderChecklist() {
      const container = document.getElementById('checklistContainer');
      const items = CHECKLIST_CONFIG[currentDisasterType] || [];
      container.innerHTML = items.map(item => `
        <label class="flex items-center gap-1.5 bg-slate-900/90 border border-slate-800 px-2 py-1.5 rounded cursor-pointer hover:border-slate-600">
          <input type="checkbox" id="${item.id}" onchange="evaluateTriageFromChecks()" class="accent-sky-500 rounded" />
          <span class="text-slate-200 truncate">${item.label}</span>
        </label>
      `).join('');
    }

    // 音声認識（マイク入力）によるメモ追記
    function startVoiceDictation() {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) {
        alert('お使いのブラウザは音声認識に対応していません（Chrome推奨）。');
        return;
      }
      const recognition = new SpeechRecognition();
      recognition.lang = 'ja-JP';
      const btn = document.getElementById('btnVoiceInput');
      btn.textContent = '聴取中...';
      btn.classList.add('text-rose-400');

      recognition.onresult = (event) => {
        const transcript = event.results[0][0].transcript;
        const memoEl = document.getElementById('inputMemo');
        memoEl.value = (memoEl.value ? memoEl.value + ' ' : '') + transcript;
        onManualInput();
        analyzeReception();
      };
      recognition.onend = () => {
        btn.textContent = '音声入力';
        btn.classList.remove('text-rose-400');
      };
      recognition.start();
    }

    // メモテキストからキーワード抽出＆チェックボックス自動連動
    function analyzeReception() {
      const memo = document.getElementById('inputMemo').value;
      const items = CHECKLIST_CONFIG[currentDisasterType] || [];
      const matchedWords = [];

      items.forEach(item => {
        const cb = document.getElementById(item.id);
        if (!cb) return;
        const hit = item.keywords.find(kw => memo.includes(kw));
        if (hit) {
          cb.checked = true;
          matchedWords.push(hit);
        }
      });

      const kwContainer = document.getElementById('detectedKeywords');
      kwContainer.innerHTML = matchedWords.map(w => `
        <span class="text-[11px] bg-rose-950 text-rose-300 border border-rose-700/70 px-2 py-0.5 rounded">検知: ${w}</span>
      `).join('');

      evaluateTriageFromChecks();
    }

    // チェック状態に基づく緊急度判定・口頭指導・自動部隊編成
    function evaluateTriageFromChecks() {
      const isChecked = (id) => Boolean(document.getElementById(id)?.checked);
      let level = 'medium';
      let scaleTitle = '';
      let guidance = '';
      let requiredTypes = [];

      if (currentDisasterType === 'fire') {
        if (isChecked('f_trapped') || isChecked('f_danger') || (isChecked('f_flame') && isChecked('f_building'))) {
          level = 'high';
          scaleTitle = '建物火災 第2出動相当（特別高度救助編成）';
          guidance = '【緊急避難指示】初期消火は行わず、姿勢を低くして直ちに建物外へ避難するよう伝えてください。';
          requiredTypes = ['pump', 'pump', 'ladder', 'rescue', 'command', 'ambulance'];
        } else if (isChecked('f_alarm') && !isChecked('f_flame') && !isChecked('f_smoke')) {
          level = 'low';
          scaleTitle = '火災調査出動（小隊編成）';
          guidance = '受信機の表示階を確認し、安全を確かめた上で消防隊を屋外で誘導するよう伝えてください。';
          requiredTypes = ['pump'];
        } else {
          level = 'medium';
          scaleTitle = '建物火災 第1出動相当';
          guidance = '周囲の住民へ火災を知らせ、安全な場所へ避難して消防隊を待つよう指示してください。';
          requiredTypes = ['pump', 'pump', 'ladder', 'command'];
        }
      } else if (currentDisasterType === 'ems') {
        if (isChecked('e_no_resp') || isChecked('e_no_breath') || isChecked('e_bleed')) {
          level = 'high';
          scaleTitle = '緊急度：高（CPA疑い・PA連携出動）';
          guidance = '【口頭指導：胸骨圧迫】平らな場所に仰向けにし、胸の真ん中を強く・速く絶え間なく押すよう指導してください。';
          requiredTypes = ['ambulance', 'pump'];
        } else if (isChecked('e_chest')) {
          level = 'high';
          scaleTitle = '緊急度：高（急性冠症候群・脳卒中疑い）';
          guidance = '楽な姿勢で安静にさせ、衣服を緩めて絶対に歩かせないよう指示してください。';
          requiredTypes = ['ambulance'];
        } else {
          level = 'low';
          scaleTitle = '緊急度：低（通常救急出動）';
          guidance = '保険証・お薬手帳を準備し、可能であれば玄関の鍵を開けて救急隊の到着を待つよう伝えてください。';
          requiredTypes = ['ambulance'];
        }
      } else {
        if (isChecked('r_trap') || isChecked('r_high')) {
          level = 'high';
          scaleTitle = '救助出動（SR特別高度救助隊編成）';
          guidance = '二次災害防止のため通報者は現場に近づかず、要救助者への声かけのみ行うよう指示してください。';
          requiredTypes = ['rescue', 'pump', 'ambulance', 'command'];
        } else {
          level = 'medium';
          scaleTitle = '一般救助出動';
          guidance = '後続車への合図など安全確保を行い、救助隊の到着を待つよう伝えてください。';
          requiredTypes = ['rescue', 'pump'];
        }
      }

      updateTriageCardUI(level, scaleTitle, guidance);
      autoAssignUnits(requiredTypes);
    }

    // 緊急度カードの配色更新
    function updateTriageCardUI(level, scaleTitle, guidance) {
      const card = document.getElementById('triageCard');
      const badge = document.getElementById('triageBadge');
      document.getElementById('triageScaleText').textContent = scaleTitle;
      document.getElementById('oralGuidanceText').textContent = guidance;

      if (level === 'high') {
        card.className = 'rounded-lg p-3 border bg-rose-950/60 border-rose-500 transition-colors';
        badge.className = 'text-xs font-bold px-2.5 py-0.5 rounded bg-rose-600 text-white';
        badge.textContent = '緊急度：高（最優先）';
      } else if (level === 'medium') {
        card.className = 'rounded-lg p-3 border bg-amber-950/40 border-amber-500/70 transition-colors';
        badge.className = 'text-xs font-bold px-2.5 py-0.5 rounded bg-amber-600 text-white';
        badge.textContent = '緊急度：中';
      } else {
        card.className = 'rounded-lg p-3 border bg-emerald-950/40 border-emerald-600/60 transition-colors';
        badge.className = 'text-xs font-bold px-2.5 py-0.5 rounded bg-emerald-600 text-white';
        badge.textContent = '緊急度：低';
      }
    }

    // 出動可能車両から必要車種を自動抽出
    function autoAssignUnits(requiredTypes = null) {
      if (!requiredTypes) {
        evaluateTriageFromChecks();
        return;
      }
      const standby = vehicles.filter(v => v.status === 'standby');
      const picked = [];

      requiredTypes.forEach(reqType => {
        const found = standby.find(v => v.type === reqType && !picked.includes(v.code));
        if (found) picked.push(found.code);
      });

      selectedUnitCodes = picked;
      renderAssignedUnits();
      renderStandbyPool();
      updateDispatchPreview();
    }

    // 編成済出動隊バッジ描画
    function renderAssignedUnits() {
      const container = document.getElementById('assignedUnitsList');
      if (selectedUnitCodes.length === 0) {
        container.innerHTML = '<span class="text-xs text-slate-500">出動隊が未選択です</span>';
        return;
      }
      container.innerHTML = selectedUnitCodes.map(code => {
        const v = vehicles.find(item => item.code === code);
        const label = v ? v.name : code;
        return `
          <button type="button" onclick="toggleUnitSelection('${code}')" class="bg-rose-900/70 hover:bg-rose-800 text-rose-100 border border-rose-500/70 px-2.5 py-1 rounded text-xs font-bold flex items-center gap-1 cursor-pointer">
            <span>${label}</span>
            <span class="text-rose-300 text-[10px]">×</span>
          </button>
        `;
      }).join('');
    }

    // 出動可能プール車両一覧描画
    function renderStandbyPool() {
      const container = document.getElementById('standbyPoolList');
      const available = vehicles.filter(v => v.status === 'standby' && !selectedUnitCodes.includes(v.code));
      container.innerHTML = available.map(v => `
        <button type="button" onclick="toggleUnitSelection('${v.code}')" class="bg-slate-900 hover:bg-slate-800 text-slate-300 border border-slate-700 px-2 py-1 rounded text-[11px] cursor-pointer">
          + ${v.name}
        </button>
      `).join('');
    }

    // 出動隊の手動追加・解除
    function toggleUnitSelection(code) {
      if (selectedUnitCodes.includes(code)) {
        selectedUnitCodes = selectedUnitCodes.filter(c => c !== code);
      } else {
        selectedUnitCodes.push(code);
      }
      renderAssignedUnits();
      renderStandbyPool();
      updateDispatchPreview();
    }

    // 指令電文の自動組み立て
    function updateDispatchPreview() {
      const typeLabel = { fire: '火災指令', ems: '救急指令', rescue: '救助指令' }[currentDisasterType];
      const address = document.getElementById('inputAddress').value.trim() || '横浜市内、通報地点付近';
      const landmark = document.getElementById('inputLandmark').value.trim();
      const subType = document.getElementById('inputSubType').value.trim() || '調査事案';
      const memo = document.getElementById('inputMemo').value.trim();

      const unitNames = selectedUnitCodes
        .map(c => vehicles.find(v => v.code === c)?.name || c)
        .join('、');

      const landmarkPart = landmark ? `目標、${landmark}。` : '';
      const memoShort = memo ? `${memo.slice(0, 45)}${memo.length > 45 ? '…' : ''}との通報。` : '';
      const unitsPart = unitNames ? `出動隊、${unitNames}。` : '出動隊、直近隊。';

      const fullText = `${typeLabel}。${address}、${landmarkPart}${subType}。${memoShort}${unitsPart}以上、${typeLabel}。`;
      document.getElementById('dispatchText').value = fullText;
    }

    // 予告チャイム＋無線PTT音＋音声合成での指令放送実行
    async function executeDispatch() {
      const dispatchText = document.getElementById('dispatchText').value.trim();
      if (!dispatchText) return;

      stopRingtone();
      const chimeType = document.getElementById('chimeSelect').value;

      // 予告チャイム＋PTTトーン再生
      await playDispatchChimeAndPtt(chimeType);

      // 日本語音声合成で指令電文を読み上げ＋終了時スケルチ音
      speakDispatchMessage(dispatchText);

      // 編成隊のステータスを「出場中」へ更新
      vehicles = vehicles.map(v =>
        selectedUnitCodes.includes(v.code) ? { ...v, status: 'dispatched' } : v
      );

      if (callState === 'idle' || callState === 'ringing') {
        callState = 'connected';
        updateCallControlButtons();
      }

      selectedUnitCodes = [];
      renderAssignedUnits();
      renderStandbyPool();
      renderAvmList();
    }

    // Web Audio API による指令予告チャイム＆PTT音合成
    function playDispatchChimeAndPtt(type) {
      return new Promise((resolve) => {
        const ctx = getAudioContext();
        const now = ctx.currentTime;

        const patterns = {
          fire: [523.25, 659.25, 783.99, 1046.5],
          ems: [587.33, 440.0, 587.33, 440.0],
          rescue: [659.25, 523.25, 659.25, 783.99]
        };
        const notes = patterns[type] || patterns.fire;

        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, now + idx * 0.28);
          gain.gain.setValueAtTime(0.001, now + idx * 0.28);
          gain.gain.exponentialRampToValueAtTime(0.22, now + idx * 0.28 + 0.03);
          gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.28 + 0.26);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(now + idx * 0.28);
          osc.stop(now + idx * 0.28 + 0.27);
        });

        // 無線PTT開始音（ピッ）
        const pttStart = now + notes.length * 0.28 + 0.12;
        const pttOsc = ctx.createOscillator();
        const pttGain = ctx.createGain();
        pttOsc.type = 'sine';
        pttOsc.frequency.setValueAtTime(1400, pttStart);
        pttGain.gain.setValueAtTime(0.12, pttStart);
        pttGain.gain.exponentialRampToValueAtTime(0.001, pttStart + 0.08);
        pttOsc.connect(pttGain);
        pttGain.connect(ctx.destination);
        pttOsc.start(pttStart);
        pttOsc.stop(pttStart + 0.09);

        setTimeout(resolve, (notes.length * 280) + 240);
      });
    }

    // 無線スケルチテール音（ザッ）再生
    function playSquelchTail() {
      const ctx = getAudioContext();
      const bufferSize = ctx.sampleRate * 0.14;
      const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) {
        data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
      }
      const noise = ctx.createBufferSource();
      noise.buffer = buffer;

      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.frequency.value = 1800;

      const gain = ctx.createGain();
      gain.gain.value = 0.15;

      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start();
    }

    // Web Speech API による指令文読み上げ
    function speakDispatchMessage(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();

      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = 'ja-JP';
      utter.rate = 1.08;
      utter.pitch = 1.05;

      const voices = window.speechSynthesis.getVoices();
      const jpVoice = voices.find(v => v.lang.includes('ja'));
      if (jpVoice) utter.voice = jpVoice;

      utter.onend = () => {
        playSquelchTail();
      };
      window.speechSynthesis.speak(utter);
    }

    // AVM車両動態一覧の描画
    function renderAvmList() {
      const container = document.getElementById('avmPanel');
      const standbyCount = vehicles.filter(v => v.status === 'standby').length;
      document.getElementById('standbyCountLabel').textContent = `出動可能: ${standbyCount} / ${vehicles.length}隊`;

      const statusMeta = {
        standby: { label: '出動可能', badge: 'bg-emerald-950 text-emerald-300 border-emerald-700', next: 'dispatched' },
        dispatched: { label: '出場中', badge: 'bg-rose-600 text-white border-rose-400', next: 'on_scene' },
        on_scene: { label: '現着・活動', badge: 'bg-amber-600 text-white border-amber-400', next: 'returning' },
        returning: { label: '引揚途上', badge: 'bg-sky-700 text-white border-sky-400', next: 'standby' }
      };

      container.innerHTML = vehicles.map(v => {
        const meta = statusMeta[v.status] || statusMeta.standby;
        return `
          <div class="flex items-center justify-between bg-slate-900/90 border border-slate-800 px-2.5 py-1.5 rounded text-xs">
            <div>
              <span class="font-bold text-white">${v.name}</span>
              <span class="text-[11px] text-slate-400 ml-1.5">${v.type_label}</span>
            </div>
            <button type="button" onclick="cycleVehicleStatus('${v.code}', '${meta.next}')" title="クリックで動態ステータス切替" class="px-2.5 py-0.5 rounded text-[11px] font-bold border transition cursor-pointer ${meta.badge}">
              ${meta.label}
            </button>
          </div>
        `;
      }).join('');
    }

    // 車両動態ステータス循環更新（出動可能→出場中→現着→引揚→出動可能）
    function cycleVehicleStatus(code, nextStatus) {
      vehicles = vehicles.map(v => v.code === code ? { ...v, status: nextStatus } : v);
      if (nextStatus !== 'standby') {
        selectedUnitCodes = selectedUnitCodes.filter(c => c !== code);
        renderAssignedUnits();
        updateDispatchPreview();
      }
      renderAvmList();
      renderStandbyPool();
    }
  </script>
</body>
